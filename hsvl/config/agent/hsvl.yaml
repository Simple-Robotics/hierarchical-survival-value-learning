agent_name: "hsvl"

# optimizer / training
lr: 3e-4
batch_size: 1024
critic_agg: "min" # mean or min

# network sizes
value_hidden_dims: [512, 512, 512]
actor_hidden_dims: [512, 512, 512]
layer_norm: true
activation_fn: "gelu"
k_basis: 256
num_basis_sets: 16
residual_actor: true
residual_critic: false
critic_num_blocks: 2             # only used when residual_critic
actor_num_blocks: 2              # only used when residual_actor

# RL
discount: 0.995
const_std: true

# hierarchy
subgoal_steps: 25
rep_dim: 256
low_actor_rep_grad: false

# AWR extraction
low_alpha: 3.0
high_alpha: 3.0

# frame stacking
frame_stack: 1

# goal sampling
value_p_curgoal: 0.08
value_p_trajgoal: 0.6
value_p_randomgoal: 0.32
value_geom_sample: true

# actor sampling
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false

# survival
surv_horizon: 10000
num_log_bins: 800
ensemble: true
add_tail: true
